# format = '$all$git_commit$character'
format = '$all$character'


# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[UCRT64>](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'
error_symbol = '[UCRT64>](bold red)'

[battery]
full_symbol = '🔋 '
charging_symbol = '⚡️ '
discharging_symbol = '💀 '

[dotnet]
format = 'via [$symbol($version )(🎯 $tfm )]($style)'

[git_commit]
commit_hash_length = 7
tag_symbol = '🔖 '
only_detached = false
format = '[$hash$tag]($style) '

[git_branch]
symbol = '🌱 '
# ignore_branches = ['master', 'main']

[cmd_duration]
min_time = 1
show_milliseconds = true
format = '[took $duration](bold yellow)'

