# Terminal capabilities.
set -g default-terminal "tmux-256color"

# Keep useful amounts of per-pane scrollback.
set -g history-limit 50000

# Mouse: pane selection, resizing, scrolling, copy mode.
set -g mouse on

# Prefer familiar arrow/PageUp/PageDown behaviour in copy mode.
set -g mode-keys emacs

# Plain PageUp enters copy mode and scrolls one page.
# Once in copy mode, PageUp/PageDown already scroll normally.
bind -n PageUp copy-mode -u

# Mouse selection:
# copy, but NEVER leave copy mode / snap back to the live bottom.
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-no-clear

# New panes/windows inherit the current pane's working directory.
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Convenient config reload.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Copy paste behaviour.
set -s set-clipboard external
# bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-no-clear
ClicksTargetApp=no
ClickTargetMod=shift
CopyOnSelect=yes
RightClickAction=paste


# Calm status line.

set -g status-style 'bg=#883838,fg=#b0b0b0'

set -g status-position top

set -g status-left ' #[bold]#S#[nobold] '
set -g status-left-length 30

set -g status-right '#H  %H:%M '
set -g status-right-length 50

set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-style 'fg=#888888,bg=#282828'
set -g window-status-current-style 'fg=#ffffff,bg=#484848,bold'

# Make the active pane boundary visible without neon.
set -g pane-border-style 'fg=#444444'
set -g pane-active-border-style 'fg=#999999'



